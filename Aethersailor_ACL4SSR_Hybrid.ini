; Aethersailor + ACL4SSR Hybrid
; 规则底座：Aethersailor Custom_Clash_Fallback
; 分组逻辑：参考 cmliu ACL4SSR_Online_Full_MultiMode_CF
; 核心设计：
; 1. 🚀 节点选择：总控，手动选择国家/自动选择/官方优选/手动节点
; 2. ♻️ 自动选择：在国家组之间自动选择，因此可能发生国家漂移
; 3. 各国家节点组：只在本国节点内部 url-test，不会跨国家漂移
; 4. 各业务组：默认跟随 🚀 节点选择，也可单独指定国家/自动选择
; 5. 相比 Aethersailor 原版 fallback：业务组改为 select，减少大量重复健康检查
; 6. 保留 Aethersailor 的 GEOSITE/GEOIP 规则体系
; 7. 增加 CloudflareCDN 独立分组，方便单独控制 CF 流量
; 8. 兼容传统 subconverter 0.9.9：不使用 Proxy Provider，目标为生成完整 proxies

